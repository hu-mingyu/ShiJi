<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icons/shiji-icon-512.png" />
    <link id="apple-touch-icon" rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%icons/apple-touch-icon.png" />
    <script>
      (() => {
        const icon = document.getElementById('apple-touch-icon');
        const lightIcon = icon.href;
        const darkIcon = lightIcon.replace(/apple-touch-icon\.png$/, 'apple-touch-icon-dark.png');
        const appearance = window.matchMedia('(prefers-color-scheme: dark)');
        const updateIcon = () => { icon.href = appearance.matches ? darkIcon : lightIcon; };
        updateIcon();
        appearance.addEventListener?.('change', updateIcon);
      })();
    </script>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="ShiJi" />
    <title>ShiJi</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
